<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پلان ختم قرآن + اوقات نماز</title>

<style>
:root{
  --green:#0b3d2e;
  --bg:#f5f7f6;
  --card:#ffffff;
  --border:#e3e7e6;
  --bottomH:120px;
}

html,body{
  margin:0;
  height:100%;
  font-family:system-ui;
  background:var(--bg);
  overflow:hidden;
}

.app{
  display:flex;
  flex-direction:column;
  height:100dvh;
}

.header{
  background:#fff;
  padding:14px;
  text-align:center;
  font-weight:900;
  color:var(--green);
  border-bottom:1px solid var(--border);
}

.main{
  flex:1;
  overflow-y:auto;
  padding:15px;
  padding-bottom:calc(var(--bottomH) + 30px);
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  margin-bottom:14px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:8px;
  border-bottom:1px solid #eee;
  text-align:right;
  font-size:14px;
}

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:var(--bottomH);
  background:#fff;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
}

.bottomNav button{
  padding:12px 20px;
  border-radius:14px;
  border:1px solid #cfded7;
  background:#f0f6f4;
  font-weight:700;
}

.hidden{display:none}
</style>
</head>

<body>
<div class="app">

<div class="header">
پلان ختم قرآن + اوقات نماز
</div>

<div class="main">

<!-- KHATM -->
<div id="khatmSection">

<div class="card">
<div id="kDate"></div>
<table>
<thead>
<tr><th>جز</th><th>اسم</th></tr>
</thead>
<tbody id="kBody"></tbody>
</table>
</div>

</div>

<!-- PRAYER -->
<div id="prayerSection" class="hidden">

<div class="card">
<select id="citySelect">
<option value="mulhouse">Mulhouse</option>
<option value="nancy">Nancy</option>
<option value="strasbourg">Strasbourg</option>
<option value="lyon">Lyon</option>
<option value="auto">📍 موقعیت فعلی</option>
</select>
<button onclick="renderPrayer()">به‌روزرسانی</button>
</div>

<div class="card">
<table>
<tbody id="prayerBody"></tbody>
</table>
</div>

</div>

</div>

<div class="bottomNav">
<button onclick="showKhatm()">پلان ختم</button>
<button onclick="showPrayer()">اوقات نماز</button>
</div>

</div>

<script>
/* ===== NAVIGATION ===== */
function showKhatm(){
  document.getElementById("khatmSection").classList.remove("hidden");
  document.getElementById("prayerSection").classList.add("hidden");
}
function showPrayer(){
  document.getElementById("prayerSection").classList.remove("hidden");
  document.getElementById("khatmSection").classList.add("hidden");
}

/* ===== KHATM ===== */
const names=[
"مدیر صاحب رسا","هدایت سادات","کاکر صاحب","شکیب احمدی","مدیر صاحب ظاهر خان",
"ملا صاحب احمدی","دگروال صاحب سادات","بصیر خان عزیز","عمرزاده صاحب","جمعه خان رحمانی",
"تیمور خان تیموری","سنگی صاحب","روح الله خان صمدی","فهیم خان مشتاق","حفیظ خان عطایی",
"قاری صاحب سلیمان تیموری","انجینر صاحب ستوده","رسولی صاحب","رسولی صاحب","معاون صاحب همدرد",
"مروت صاحب","مروت صاحب","یاسین خان رحیمی","یاسین خان رحیمی","طارق تیموری",
"ارسلان تیموری","قسیم خان حیدری","رسولی صاحب","بابه گل خان فیضی","مدیر صاحب نسیم اختری"
];

function renderKhatm(){
  document.getElementById("kDate").innerText=
  new Date().toLocaleDateString("fa-IR",{dateStyle:"full"});
  let body="";
  for(let i=0;i<30;i++){
    body+=`<tr><td>جز ${i+1}</td><td>${names[i]}</td></tr>`;
  }
  document.getElementById("kBody").innerHTML=body;
}
renderKhatm();

/* ===== PRAYER SIMPLE VERSION ===== */
const cities={
  mulhouse:{lat:47.75,lng:7.33},
  nancy:{lat:48.69,lng:6.18},
  strasbourg:{lat:48.57,lng:7.75},
  lyon:{lat:45.76,lng:4.83}
};

async function renderPrayer(){
  let city=document.getElementById("citySelect").value;
  let coords;

  if(city==="auto"){
    if(!navigator.geolocation){
      alert("GPS پشتیبانی نمی‌شود");
      return;
    }
    navigator.geolocation.getCurrentPosition(pos=>{
      coords={lat:pos.coords.latitude,lng:pos.coords.longitude};
      showTimes(coords);
    },()=>{
      alert("اجازه GPS داده نشد");
    });
  }else{
    coords=cities[city];
    showTimes(coords);
  }
}

function showTimes(coords){
  let now=new Date();
  let rows=`
<tr><td>مختصات</td><td>${coords.lat.toFixed(2)} , ${coords.lng.toFixed(2)}</td></tr>
<tr><td>فجر</td><td>—</td></tr>
<tr><td>ظهر</td><td>—</td></tr>
<tr><td>عصر</td><td>—</td></tr>
<tr><td>مغرب</td><td>—</td></tr>
<tr><td>عشاء</td><td>—</td></tr>
`;
  document.getElementById("prayerBody").innerHTML=rows;
}
</script>

</body>
</html>
