<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اوقات نماز</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f4f7f6;
}
.header{
  background:#fff;
  padding:16px;
  text-align:center;
  font-weight:900;
  font-size:20px;
  color:#0b3d2e;
  border-bottom:1px solid #e3e7e6;
}
.container{padding:16px;}
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}
select,button{
  padding:10px;
  border-radius:12px;
  border:1px solid #cfded7;
  font-size:14px;
}
button{
  background:#e8f3ef;
  font-weight:700;
}
.big{
  font-size:26px;
  font-weight:900;
  color:#0b3d2e;
}
table{
  width:100%;
  border-collapse:collapse;
}
td{
  padding:10px;
  border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<div class="header">
اوقات نماز + سحر و افطار
</div>

<div class="container">

<div class="card">
<select id="citySelect">
<option value="47.75,7.33">Mulhouse</option>
<option value="48.69,6.18">Nancy</option>
<option value="48.57,7.75">Strasbourg</option>
<option value="45.76,4.83">Lyon</option>
</select>
<button onclick="loadPrayer()">به‌روزرسانی</button>
</div>

<div class="card">
تاریخ: <span id="today"></span>
</div>

<div class="card">
سحر (فجر)
<div class="big" id="fajr">--:--</div>
<br>
افطار (مغرب)
<div class="big" id="maghrib">--:--</div>
</div>

<div class="card">
<table>
<tbody id="table"></tbody>
</table>
</div>

</div>

<script>
document.getElementById("today").innerText =
new Date().toLocaleDateString("fa-IR",{dateStyle:"full"});

function loadPrayer(){
  const value = document.getElementById("citySelect").value;
  const parts = value.split(",");
  const lat = parts[0];
  const lng = parts[1];

  fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=2`)
  .then(res => res.json())
  .then(data => {
      const t = data.data.timings;

      document.getElementById("fajr").innerText = t.Fajr;
      document.getElementById("maghrib").innerText = t.Maghrib;

      document.getElementById("table").innerHTML = `
      <tr><td>فجر</td><td>${t.Fajr}</td></tr>
      <tr><td>طلوع</td><td>${t.Sunrise}</td></tr>
      <tr><td>ظهر</td><td>${t.Dhuhr}</td></tr>
      <tr><td>عصر</td><td>${t.Asr}</td></tr>
      <tr><td>مغرب</td><td>${t.Maghrib}</td></tr>
      <tr><td>عشاء</td><td>${t.Isha}</td></tr>
      `;
  });
}

loadPrayer();
</script>

</body>
</html>
