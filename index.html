<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اوقات نماز</title>

<style>
:root{
  --green:#0b3d2e;
  --bg:#f4f7f6;
  --card:#ffffff;
  --border:#e3e7e6;
}

html,body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
}

.header{
  background:#fff;
  padding:16px;
  text-align:center;
  font-weight:900;
  font-size:18px;
  color:var(--green);
  border-bottom:1px solid var(--border);
}

.container{
  padding:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
}

select,button{
  padding:10px;
  border-radius:12px;
  border:1px solid #cfded7;
  font-size:14px;
}

button{
  background:#e8f3ef;
  font-weight:700;
}

table{
  width:100%;
  border-collapse:collapse;
}

td{
  padding:10px;
  border-bottom:1px solid #eee;
  font-size:15px;
}

.big{
  font-size:22px;
  font-weight:900;
  color:var(--green);
}
</style>
</head>

<body>

<div class="header">
اوقات نماز + سحر و افطار
</div>

<div class="container">

<div class="card">
<select id="citySelect">
<option value="mulhouse">Mulhouse</option>
<option value="nancy">Nancy</option>
<option value="strasbourg">Strasbourg</option>
<option value="lyon">Lyon</option>
<option value="auto">📍 موقعیت فعلی</option>
</select>

<button onclick="renderPrayer()">به‌روزرسانی</button>
</div>

<div class="card">
<div>تاریخ: <span id="today"></span></div>
</div>

<div class="card">
<div>سحر (فجر)</div>
<div class="big" id="fajr">--:--</div>
<br>
<div>افطار (مغرب)</div>
<div class="big" id="maghrib">--:--</div>
</div>

<div class="card">
<table>
<tbody id="prayerTable"></tbody>
</table>
</div>

</div>

<script>
const cities={
  mulhouse:{lat:47.75,lng:7.33},
  nancy:{lat:48.69,lng:6.18},
  strasbourg:{lat:48.57,lng:7.75},
  lyon:{lat:45.76,lng:4.83}
};

document.getElementById("today").innerText=
new Date().toLocaleDateString("fa-IR",{dateStyle:"full"});

function renderPrayer(){
  let city=document.getElementById("citySelect").value;
  let coords;

  if(city==="auto"){
    if(!navigator.geolocation){
      alert("GPS پشتیبانی نمی‌شود");
      return;
    }
    navigator.geolocation.getCurrentPosition(pos=>{
      coords={lat:pos.coords.latitude,lng:pos.coords.longitude};
      showTimes(coords);
    },()=>{
      alert("اجازه GPS داده نشد");
    });
  }else{
    coords=cities[city];
    showTimes(coords);
  }
}

function showTimes(coords){
  // اینجا می‌توان بعداً محاسبه نجومی دقیق گذاشت
  document.getElementById("fajr").innerText="--:--";
  document.getElementById("maghrib").innerText="--:--";

  let rows=`
<tr><td>مختصات</td><td>${coords.lat.toFixed(2)} , ${coords.lng.toFixed(2)}</td></tr>
<tr><td>فجر</td><td>--:--</td></tr>
<tr><td>ظهر</td><td>--:--</td></tr>
<tr><td>عصر</td><td>--:--</td></tr>
<tr><td>مغرب</td><td>--:--</td></tr>
<tr><td>عشاء</td><td>--:--</td></tr>
`;
  document.getElementById("prayerTable").innerHTML=rows;
}
</script>

</body>
</html>
